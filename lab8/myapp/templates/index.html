<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ app.name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>{{ app.name }}</h1>
    <p>Автор: {{ author.name }}</p>
    <p>Версия: {{ app.version }}</p>
    
    <h2>Навигация для крутых</h2>
    <nav>
        <ul>
            {% for item in navigation %}
                <li><a href="{{ item.href }}">{{ item.caption }}</a></li>
            {% endfor %}
        </ul>
    </nav>
</body>
</html>
